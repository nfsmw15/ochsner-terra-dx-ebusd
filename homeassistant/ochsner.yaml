# Stunden pro Tag je Betriebszustand – landen als Zahl in der Langzeitstatistik und bleiben dauerhaft erhalten
sensor:
  - platform: history_stats
    name: "Ochsner WP Heizbetrieb heute"
    unique_id: ochsner_wp_heizbetrieb_heute
    entity_id: sensor.heating_ochsner_waermepumpe_status_warmeerzeuger_02_053
    state: "Heizbetrieb"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Ochsner WP Warmwasserladung heute"
    unique_id: ochsner_wp_warmwasser_heute
    entity_id: sensor.heating_ochsner_warmwasserkreis_status_warmwasserregelung_02_052
    state: ["Normal Ladebetrieb", "Komfort Ladebetrieb", "Spar Ladebetrieb", "Zwangsladung"]
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Ochsner WP Vorlaufzeit heute"
    unique_id: ochsner_wp_vorlaufzeit_heute
    entity_id: sensor.heating_ochsner_waermepumpe_status_warmeerzeuger_02_053
    state: "Vorlaufzeit Heizbetrieb"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Ochsner WP Abgeschaltet heute"
    unique_id: ochsner_wp_abgeschaltet_heute
    entity_id: sensor.heating_ochsner_waermepumpe_status_warmeerzeuger_02_053
    state: "Abgeschaltet"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
